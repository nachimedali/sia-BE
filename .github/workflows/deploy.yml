name: Deploy

# Every push to `dev` is tested, then deployed to /srv/sia-BE over SSH. A red
# test job stops the deploy (F5, C6). Pull requests run the tests only.
# Server setup: deploy/dev/README in the parent workspace (secrets SSH_HOST,
# SSH_USER, SSH_PORT, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS).

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sia-be-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Real Postgres (with pgvector) and real Redis, as config/settings/test.py
    # requires: the rate limiter is a Lua script and means nothing against a fake.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: occs
          POSTGRES_PASSWORD: occs
          POSTGRES_DB: occs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U occs" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-not-secret
      # A throwaway Fernet key; CI data never outlives the job.
      FIELD_ENCRYPTION_KEY: GRIfoAFcw-BX4tX-C7YSHhBQZkm2wJ5V2fj8HAJz3xk=
      DATABASE_URL: postgres://occs:occs@127.0.0.1:5432/occs
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest -n 4

  deploy:
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    env:
      DEPLOY_PATH: /srv/sia-BE
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: a swapped server fails here instead of receiving the code.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CONF
          Host sia
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT || 22 }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CONF

      # .env, the venv, media and collected static are server state, never
      # overwritten (excluded paths are also protected from --delete).
      - name: Upload code
        run: |
          rsync -az --delete \
            --exclude '.git/' --exclude '.github/' \
            --exclude '.env' --exclude '.env.*' \
            --exclude '.venv/' --exclude 'media/' --exclude 'staticfiles/' \
            --exclude '__pycache__/' --exclude '.mypy_cache/' \
            --exclude '.pytest_cache/' --exclude '.ruff_cache/' --exclude '.e2e-mail/' \
            ./ sia:${DEPLOY_PATH}/

      - name: Install, migrate, restart
        run: |
          ssh sia 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /srv/sia-BE
          [ -d .venv ] || python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r requirements.txt
          export DJANGO_SETTINGS_MODULE=config.settings.prod
          # No `source .env`: Django reads the file itself (django-environ), and a shell
          # would choke on special characters in SECRET_KEY.
          .venv/bin/python manage.py migrate --noinput
          .venv/bin/python manage.py collectstatic --noinput
          sudo /usr/bin/supervisorctl reread
          sudo /usr/bin/supervisorctl update
          sudo /usr/bin/supervisorctl restart 'sia-be:*'
          REMOTE

      - name: Health check
        run: |
          ssh sia 'bash -se' <<'REMOTE'
          for i in $(seq 1 15); do
            if curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8010/api/v1/health/ >/dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"; exit 1
          REMOTE
