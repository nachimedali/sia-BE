[project]
name = "occs-backend"
version = "0.1.0"
requires-python = ">=3.12"

# =============================================================================
# ruff — lint + format (implementation.md §3.3)
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "DJ",   # flake8-django
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts", "analytics", "ai", "billing", "categories", "channels",
    "common", "config", "content", "onboarding", "products", "reminders",
    "scheduling", "tools", "trends", "workspaces",
]

[tool.ruff.lint.per-file-ignores]
# N818 wants an "Error" suffix on exception names. DRF's own exceptions
# (PermissionDenied, NotFound, Throttled) do not use one, and these names are
# the vocabulary design.md §7.1 uses for the status codes they map to.
"common/exceptions.py" = ["N818"]
# RUF012 asks for ClassVar on DRF's declarative class attributes
# (permission_classes, throttle_classes, ...). django-stubs types them as
# instance variables, so mypy rejects ClassVar and the two tools cannot both be
# satisfied. mypy wins; none of these lists is ever mutated.
"**/views.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]
"common/health.py" = ["RUF012"]

[tool.ruff.lint.flake8-bugbear]
# DRF and Django idiomatically use callables in argument defaults.
extend-immutable-calls = ["django.utils.translation.gettext_lazy"]

# =============================================================================
# mypy (implementation.md §3.3)
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ['/migrations/', '\.venv/']

[[tool.mypy.overrides]]
# Third-party packages that ship no stubs and no py.typed marker.
module = ["celery.*", "kombu.*", "environ.*", "time_machine.*", "django_celery_beat.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's task decorators are untyped upstream, which would otherwise make
# every task body untyped too. The bodies themselves stay annotated.
module = ["*.tasks", "config.celery"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Generated schema/migration modules are not worth annotating.
module = ["*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Application code stays strict. Test modules do not: annotating every fixture
# and assertion helper adds noise without catching anything the assertions
# themselves would miss.
module = ["*.tests.*", "tests.*", "*.conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = ["misc"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# =============================================================================
# pytest (implementation.md §3.3, §5)
# =============================================================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = [
    "tests", "common", "accounts", "workspaces", "categories", "billing", "onboarding",
    "content", "config",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    # Schedules, TTLs and cadence are tested with time-machine/freezegun, never
    # sleeps (implementation.md §5), so a slow test means a real problem.
    "--durations=10",
]
markers = [
    # Real provider adapters run only when credentials are present; the
    # deterministic fakes cover everything else (design.md §9, A8).
    "integration: hits a real external provider; skipped without credentials",
]
# Coverage floors are applied in CI, where the whole suite runs at once:
#   pytest --cov --cov-fail-under=85
# with billing/ ai/ scheduling/ reminders/ held to 95%.

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    ".venv/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
